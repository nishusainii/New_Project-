version: '3.8'

services:
  wireguard-manager:
    image: wireguard-enterprise:latest
    container_name: wireguard-manager
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - WG_INTERFACE=wg0
      - WG_CONFIG_PATH=/etc/wireguard/wg0.conf
      - WG_EXECUTION_MODE=direct
      - NFTABLES_CONFIG_PATH=/etc/nftables.conf
      - NFTABLES_ACL_PATH=/etc/nftables/acl.nft
      - DATABASE_URL=sqlite:////app/data/wireguard.db
      - APP_SECRET=replace_with_strong_random_secret_key_32chars
      - SESSION_SECRET=replace_with_strong_random_session_key
      - AUTO_IMPORT_ON_STARTUP=false
      - WG_IPAM_START_OFFSET=10
    volumes:

      - /opt/wireguard-enterprise/app:/app/app
      - /opt/wireguard-enterprise/data:/app/data
      - /etc/wireguard:/etc/wireguard
      - /etc/nftables.conf:/etc/nftables.conf
      - /etc/nftables:/etc/nftables
      - /lib/modules:/lib/modules:ro
      - /usr/sbin/nft:/usr/sbin/nft:ro
      - /usr/bin/wg:/usr/bin/wg:ro
      - /usr/bin/wg-quick:/usr/bin/wg-quick:ro
