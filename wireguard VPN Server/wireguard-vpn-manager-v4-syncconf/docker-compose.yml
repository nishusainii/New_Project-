services:
  app:
    build: .
    env_file:
      - .env

    ports:
      - "8080:8080"

    volumes:
      - ./data:/data
      - /etc/wireguard:/etc/wireguard:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    read_only: true

    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped
