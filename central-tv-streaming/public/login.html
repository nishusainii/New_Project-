<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CiSAI Central TV - Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0a0e17 80%);
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: rgba(17, 24, 39, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
    }

    .brand-pill {
      display: inline-flex;
      background: #ffffff;
      padding: 8px 18px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      margin-bottom: 24px;
    }

    .login-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      background: rgba(10, 14, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px 14px 12px 42px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
      background: rgba(15, 23, 42, 0.95);
    }

    .error-alert {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      text-align: left;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand-pill">
        <img src="/logo.png" alt="CiSAI Logo" style="height: 38px; display: block;">
      </div>

      <h1 class="login-title">Central TV Network</h1>
      <p class="login-subtitle">
        Sign in to orchestrate displays, schedule signage, and stream live presentations across all office locations.
      </p>

      <div id="error-box" class="error-alert"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Username or Email</label>
          <input type="text" id="username" class="form-input" placeholder="admin" required autofocus autocomplete="username" style="padding-left: 14px;">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" style="padding-left: 14px;">
        </div>

        <button type="submit" id="btn-login" class="btn-submit">
          <span>Sign In to Console</span>
          <span style="font-size: 16px;">➔</span>
        </button>

        <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.08); text-align: left;">
          <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">
            Authorized Access Roles
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text-muted);">
            <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.03); padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.05);">
              <div><strong style="color: var(--accent-cyan);">admin</strong> &bull; Full Fleet & Network Admin</div>
              <span style="font-size: 11px; opacity: 0.7;">Dashboard</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.03); padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.05);">
              <div><strong style="color: var(--accent-blue);">streamer</strong> &bull; Media Upload & Live Streamer</div>
              <span style="font-size: 11px; opacity: 0.7;">Studio</span>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('error-box');
      const btn = document.getElementById('btn-login');

      errorBox.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span>Verifying...</span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          btn.innerHTML = '<span>Success! Redirecting...</span>';
          localStorage.setItem('tv_auth_token', data.token);
          if (data.user) {
            localStorage.setItem('tv_user', JSON.stringify(data.user));
          }

          const urlParams = new URLSearchParams(window.location.search);
          const defaultRedirect = (data.user?.role === 'streamer') ? '/presenter.html' : '/admin.html';
          const redirect = urlParams.get('redirect') || defaultRedirect;
          setTimeout(() => {
            window.location.href = redirect;
          }, 350);
        } else {
          errorBox.textContent = data.error || 'Invalid username or password.';
          errorBox.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<span>Sign In to Console</span> <span style="font-size: 16px;">➔</span>';
        }
      } catch (err) {
        errorBox.textContent = 'Server connection error: ' + err.message;
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In to Console</span> <span style="font-size: 16px;">➔</span>';
      }
    }
  </script>
</body>
</html>
