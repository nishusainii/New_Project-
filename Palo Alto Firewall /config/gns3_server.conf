[Server]
host = 0.0.0.0
port = 3080
ssl = False

images_path = /data/images
projects_path = /data/projects
appliances_path = /data/appliances
symbols_path = /data/symbols

report_errors = False

console_start_port_range = 5000
console_end_port_range = 10000

vnc_console_start_port_range = 5900
vnc_console_end_port_range = 6500

udp_start_port_range = 20000
udp_end_port_range = 30000

auth = False

allowed_interfaces = lo,enp44s0,docker0,virbr0
default_nat_interface = docker0

enable_builtin_templates = True
install_builtin_appliances = True
hardware_virtualization_check = True

[Qemu]
enable_kvm = True
require_kvm = True
enable_hardware_acceleration = True
require_hardware_acceleration = False
