# ==============================================================================
# ISC-DHCP Server Configuration for Wi-Fi Subnet
# Subnet: 10.31.1.0/24 (Pool: 10.31.1.50 - 10.31.1.250)
# ==============================================================================

authoritative;
default-lease-time 28800;   # 8 hours
max-lease-time 28800;       # 8 hours (Mitigates starvation / IP exhaustion)

subnet 10.31.1.0 netmask 255.255.255.0 {
    range 10.31.1.50 10.31.1.250;
    option subnet-mask 255.255.255.0;
    option broadcast-address 10.31.1.255;
    option routers 10.31.1.1;
    option domain-name-servers 8.8.8.8, 1.1.1.1;
    option domain-name "innspark.in";
}
