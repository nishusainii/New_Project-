# Local test client
client localhost {
    ipaddr = 127.0.0.1
    proto = *
    secret = H@rd3n3d-L0c4l-S3cr3t-2026#V9
    require_message_authenticator = yes
    nas_type = other
    limit {
        max_connections = 16
        lifetime = 0
        idle_timeout = 30
    }
}

# Corporate Wi-Fi Access Points & Controllers Subnet
client corporate_aps {
    ipaddr = 192.168.2.0/24
    proto = *
    secret = SafeRadiusSharedSecret2026!
    require_message_authenticator = yes
    nas_type = other
    limit {
        max_connections = 128
        lifetime = 0
        idle_timeout = 30
    }
}
