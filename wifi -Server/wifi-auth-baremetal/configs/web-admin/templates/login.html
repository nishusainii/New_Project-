<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Innspark Enterprise Wi-Fi & LDAP Identity Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">

  <!-- Ambient Glowing Background Orbs -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-grid-overlay"></div>

  <div class="login-wrapper">
    <div class="login-card">

      <!-- Brand & Security Header -->
      <div class="login-brand-header">
        <div class="brand-logo login-logo">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
          </svg>
        </div>
        <h1 class="login-title">INNSPARK TECHNOLOGIES</h1>
        <p class="login-subtitle">802.1X Enterprise Wi-Fi &amp; LDAP Identity Console</p>
        
        <div class="login-security-badge">
          <span class="indicator-dot online"></span>
          <span>AAA Authentication Active &bull; BlastRADIUS Immune</span>
        </div>
      </div>

      <!-- Authentication Form -->
      <form class="login-form" action="/login" method="POST" id="login-form" autocomplete="off">
        <input type="hidden" name="next" value="{{ next }}">

        <!-- Error Alert -->
        {% if error %}
        <div class="login-alert-error" role="alert">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Username Input -->
        <div class="form-group login-field">
          <label for="login-username">Directory Username / Admin DN</label>
          <div class="input-icon-group">
            <span class="field-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              id="login-username" 
              name="username" 
              placeholder="Username or corporate email" 
              value="{{ username or '' }}" 
              required 
              autofocus
            >
          </div>
        </div>

        <!-- Password Input -->
        <div class="form-group login-field">
          <label for="login-password">Password</label>
          <div class="input-icon-group">
            <span class="field-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="login-password" 
              name="password" 
              placeholder="Enter directory password" 
              required
            >
            <button type="button" class="btn-toggle-pw" id="toggle-pw-btn" title="Toggle password visibility">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-login-submit" id="btn-submit-login">
          <span>Authenticate &amp; Open Console</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

      </form>

      <!-- Footer Info Cluster -->
      <div class="login-footer">
        <div class="login-node-info">
          <span>OpenLDAP: <strong>{{ ldap_host }}</strong></span>
          <span>&bull;</span>
          <span>Base DN: <strong>{{ domain }}</strong></span>
        </div>
        <div class="login-disclaimer">
          Innspark Technologies (P) Ltd. &bull; Enterprise 802.1X Infrastructure
        </div>
      </div>

    </div>
  </div>

  <script>
    // Toggle Password Visibility
    const toggleBtn = document.getElementById("toggle-pw-btn");
    const pwInput = document.getElementById("login-password");
    const eyeOpen = toggleBtn.querySelector(".eye-open");
    const eyeClosed = toggleBtn.querySelector(".eye-closed");

    toggleBtn.addEventListener("click", () => {
      if (pwInput.type === "password") {
        pwInput.type = "text";
        eyeOpen.style.display = "none";
        eyeClosed.style.display = "block";
      } else {
        pwInput.type = "password";
        eyeOpen.style.display = "block";
        eyeClosed.style.display = "none";
      }
    });
  </script>
</body>
</html>
