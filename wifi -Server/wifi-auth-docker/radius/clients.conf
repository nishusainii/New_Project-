# ==============================================================================
# Hardened FreeRADIUS Clients Configuration: Innspark
# Hardened against BlastRADIUS (CVE-2024-3596) & Unauthorized Client Injection
# ==============================================================================

# Localhost test client (strictly requires Message-Authenticator)
client localhost {
	ipaddr = 127.0.0.1
	proto = *
	secret = H@rd3n3d-L0c4l-S3cr3t-2026#V9
	require_message_authenticator = yes
	nas_type = other
	limit {
		max_connections = 64
		lifetime = 0
		idle_timeout = 30
	}
}

client localhost_ipv6 {
	ipv6addr = ::1
	secret = H@rd3n3d-L0c4l-S3cr3t-2026#V9
	require_message_authenticator = yes
}

# Production Wi-Fi Access Point Network (Server B subnet 192.168.2.0/24)
client innspark_ap_network {
	ipaddr = 192.168.2.0/24
	secret = InnsparkRadiusSecret2026!
	require_message_authenticator = yes
	nas_type = other
	limit {
		max_connections = 128
		lifetime = 0
		idle_timeout = 30
	}
}

