<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Never cache: this page is re-written on every report run with the
     freshest dashboard target, so a stale cached copy would defeat it. -->
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<title>CISAI · Restricted · Sign in</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 800px at 20% 10%,#16213e 0%,#0a0f1e 55%,#060913 100%);
    color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    text-align:center;overflow:hidden;
  }
  body::before,body::after{
    content:"";position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;
  }
  body::before{width:420px;height:420px;top:-120px;right:-100px;
    background:radial-gradient(circle,rgba(34,211,238,.26),transparent 65%)}
  body::after{width:460px;height:460px;bottom:-150px;left:-120px;
    background:radial-gradient(circle,rgba(192,132,252,.22),transparent 65%)}
  .card{
    position:relative;z-index:1;width:min(92vw,400px);padding:2.7rem 2.4rem 2rem;
    border:1px solid rgba(148,185,255,.22);border-radius:1rem;
    background:rgba(10,18,38,.82);backdrop-filter:blur(8px);
    box-shadow:0 20px 55px rgba(2,6,20,.6),0 0 40px rgba(56,189,248,.12);
  }
  .lock{
    width:56px;height:56px;margin:0 auto 1.1rem;border-radius:16px;
    display:flex;align-items:center;justify-content:center;font-size:26px;
    background:linear-gradient(135deg,#3b82f6 0%,#6366f1 50%,#a855f7 100%);
    box-shadow:0 8px 26px rgba(99,102,241,.35);
  }
  h1{
    margin:.6rem 0 .35rem;font-size:1.22rem;line-height:1.3;
    background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;background-clip:text;
    color:transparent;
  }
  p.sub{margin:.15rem 0 1.5rem;color:#93a7c7;font-size:.9rem}
  form{margin:0}
  label{display:block;text-align:left;color:#93a7c7;font-size:.72rem;text-transform:uppercase;
    letter-spacing:.1em;margin:0 0 .4rem;font-weight:600}
  input{
    width:100%;padding:.75rem .95rem;border-radius:.55rem;border:1px solid rgba(148,185,255,.3);
    background:rgba(255,255,255,.045);color:#eef4ff;font-size:1rem;outline:none;
    transition:border-color .18s,box-shadow .18s;
  }
  input::placeholder{color:#5d7296}
  input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.18)}
  button{
    margin-top:1.15rem;width:100%;padding:.75rem;border:0;border-radius:.55rem;cursor:pointer;
    font-size:.95rem;font-weight:700;color:#06121f;letter-spacing:.02em;
    background:linear-gradient(90deg,#3b82f6 0%,#6366f1 50%,#a855f7 100%);
    box-shadow:0 10px 26px rgba(99,102,241,.3);transition:filter .18s,transform .18s;
  }
  button:hover{filter:brightness(1.12)}
  button:active{transform:translateY(1px)}
  .err{display:none;margin:1rem 0 0;color:#fb7185;font-size:.85rem}
  .foot{margin:1.4rem 0 0;color:#5d7296;font-size:.75rem;line-height:1.6}
  .foot b{color:#7dd3fc;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <div class="lock">&#128274;</div>
    <h1>Proxy Network Intelligence Dashboard</h1>
    <p class="sub">Restricted access &mdash; sign in to continue</p>

    <form id="f" autocomplete="off">
      <label for="pass">Access key</label>
      <input type="password" id="pass" placeholder="Enter your access key"
             autocomplete="current-password" autofocus>
      <button type="submit">Sign in</button>
    </form>

    <p id="err" class="err" role="alert">Invalid access key &mdash; please try again.</p>

    <p class="foot">Period: <b id="period">@@PERIOD@@</b><br>@@NOTE@@</p>
  </div>
  <script>
/* ==================================================================
   CISAI access gate — a self-contained login page for a static
   dashboard. The *key* never appears in this file; only its SHA-256
   digest is embedded by the runner at generation time (plus a
   plaintext fallback when sha256sum is unavailable). Remember this
   is a convenience GATE, not hard security — anyone who can read the
   page's source can extract the digest and forge a cookie. If you
   need real protection, protect the output_dir with Apache Basic Auth
   instead (see the README).
   ================================================================== */
var TARGET="@@TARGET@@";     // newest report dashboard (filled by the runner)
var MODE="@@MODE@@";         // "hash" | "plain"
var HASH="@@HASH@@";         // sha256 hex digest of the access key
var PASSWORD="@@PASSWORD@@"; // plain key (only used in "plain" mode)
var CK="cisoi_gate";

/* ---- compact SHA-256 -> lowercase hex (browser-safe; crypto.subtle
       is unavailable over plain HTTP, so we ship our own) ---- */
function sha256hex(str){
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
         0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
         0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
         0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
         0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
         0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
         0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
         0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  function rotr(x,n){return (x>>>n)|(x<<(32-n));}
  var msg=new TextEncoder().encode(str);
  var len=msg.length;
  var n=(((len+8)>>6)+1)<<6;
  var pad=new Uint8Array(n);
  pad.set(msg);
  pad[len]=0x80;
  var hi=Math.floor((len*8)/4294967296), lo=(len*8)>>>0;
  pad[n-8]=(hi>>>24)&255; pad[n-7]=(hi>>>16)&255; pad[n-6]=(hi>>>8)&255; pad[n-5]=hi&255;
  pad[n-4]=(lo>>>24)&255; pad[n-3]=(lo>>>16)&255; pad[n-2]=(lo>>>8)&255; pad[n-1]=lo&255;
  var i,j,t,off,s0,s1,S1,ch,t1,S0,maj,t2,a,b,c,d,e,f,g,h,w;
  for(off=0; off<n; off+=64){
    w=new Uint32Array(64);
    for(i=0;i<16;i++){
      w[i]=(pad[off+i*4]<<24)|(pad[off+i*4+1]<<16)|(pad[off+i*4+2]<<8)|pad[off+i*4+3];
    }
    for(j=16;j<64;j++){
      s0=rotr(w[j-15],7)^rotr(w[j-15],18)^(w[j-15]>>>3);
      s1=rotr(w[j-2],17)^rotr(w[j-2],19)^(w[j-2]>>>10);
      w[j]=(w[j-16]+s0+w[j-7]+s1)|0;
    }
    a=H[0];b=H[1];c=H[2];d=H[3];e=H[4];f=H[5];g=H[6];h=H[7];
    for(t=0;t<64;t++){
      S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      ch=(e&f)^(~e&g);
      t1=(h+S1+ch+K[t]+w[t])|0;
      S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      maj=(a&b)^(a&c)^(b&c);
      t2=(S0+maj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  var out="",k;
  for(k=0;k<8;k++){
    out+=((H[k]>>>24)&255).toString(16).padStart(2,"0");
    out+=((H[k]>>>16)&255).toString(16).padStart(2,"0");
    out+=((H[k]>>>8)&255).toString(16).padStart(2,"0");
    out+=((H[k])&255).toString(16).padStart(2,"0");
  }
  return out;
}
/* ---- cookie helpers ---- */
function getCookie(n){
  var m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));
  return m?m[1]:"";
}
function setGateCookie(){ document.cookie=CK+"=1; path=/; Max-Age="+(12*3600); }
function clearGateCookie(){ document.cookie=CK+"=; Max-Age=0; path=/"; }

/* ---- verification (exposed as a named function for re-use/tests) ---- */
function verifyKey(v){
  v=(v||"").trim();
  if(!v) return false;
  return MODE==="plain" ? (v===PASSWORD) : (sha256hex(v)===HASH);
}

/* ---- ?logout=1 : clear the cookie and show the form again ---- */
if(/[?&]logout=/.test(location.search)){
  clearGateCookie();
  location.replace(location.pathname);
}
/* ---- already signed in? skip straight to the dashboard ---- */
if(getCookie(CK)==="1"){
  location.replace(TARGET);
}

/* ---- form wiring ---- */
document.getElementById("f").addEventListener("submit",function(e){
  e.preventDefault();
  var v=document.getElementById("pass").value;
  if(!verifyKey(v)){
    document.getElementById("err").style.display="block";
    return;
  }
  setGateCookie();
  location.replace(TARGET);
});
document.getElementById("pass").addEventListener("input",function(){
  document.getElementById("err").style.display="none";
});
</script>
</body>
</html>
