# Innspark Enterprise CCTV Reverse Proxy Configuration
# Place in /etc/nginx/sites-available/inncctv and symlink to /etc/nginx/sites-enabled/

upstream inncctv_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream mediamtx_webrtc {
    server 127.0.0.1:8889;
}

upstream mediamtx_hls {
    server 127.0.0.1:8888;
}

server {
    listen 80;
    server_name _;
    # To enforce HTTPS in production, uncomment the following line:
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 1. Main Dashboard & API Reverse Proxy
    location / {
        proxy_pass http://inncctv_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # 2. WebSocket Telemetry & Alert Stream
    location /ws {
        proxy_pass http://inncctv_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # 3. WebRTC WHEP Gateway Proxy (Port 8889)
    location /whep/ {
        proxy_pass http://mediamtx_webrtc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. HLS Stream Fallback Proxy (Port 8888)
    location /hls/ {
        proxy_pass http://mediamtx_hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
