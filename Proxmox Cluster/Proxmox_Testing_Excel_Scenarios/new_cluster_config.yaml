# ===================================================================
# PROXMOX VE + CEPH + ZFS CLUSTER CONFIGURATION
# Verified and populated for cluster: cisai-pve
# ===================================================================

cluster:
  name: "cisai-pve"
  leader_node: "prox22"
  leader_ip: "10.31.6.172"
  username: "root"
  password: "(cybe6@cluster)"
  ssh_key_path: ""

nodes:
  - name: "prox22"
    mgmt_ip: "10.31.6.172"
    cluster_ip: "192.168.10.22"
    nodeid: 2
    role: "leader"
  - name: "prox23"
    mgmt_ip: "10.31.6.173"
    cluster_ip: "192.168.10.23"
    nodeid: 3
    role: "member"
  - name: "prox24"
    mgmt_ip: "10.31.6.174"
    cluster_ip: "192.168.10.24"
    nodeid: 1
    role: "member"

storage:
  ceph:
    pool: "ceph"
    expected_osds_per_node: 4
    expected_total_osds: 12
    min_quorum_mons: 3
    type: "shared_rbd"
  zfs:
    pool: "rpool"              # Root boot mirror pool
    data_pool: "zfs-ha"        # ZFS data pool

test_vms:
  - vmid: 9001
    name: "ha-test-ceph-ubuntu2204"
    storage: "ceph"
    ha_managed: true
  - vmid: 9002
    name: "zfs-test-prox24-ubuntu2204"
    storage: "zfs-ha"
    ha_managed: true
  - vmid: 9003
    name: "zfs-benchmark-prod-vm"
    storage: "ceph"
    ha_managed: true

safety_settings:
  require_user_confirmation: true
  auto_rollback_on_failure: true
  ping_check_interval_sec: 2
  health_settle_wait_sec: 10
