# ==============================================================================
# Innspark Solutions - Squid Configuration (Docker Demo Environment)
# Domain: innspark.in | Port: 3128
# ==============================================================================

http_port 3128
visible_hostname proxy.innspark.in

# ------------------------------------------------------------------------------
# Authentication & Group Helpers
# ------------------------------------------------------------------------------
auth_param basic program /usr/local/bin/squid_ldap_auth.py
auth_param basic children 10 startup=3 idle=1
auth_param basic realm Innspark Docker Demo Proxy - LDAP Authentication
auth_param basic credentialsttl 2 hours
auth_param basic casesensitive off

external_acl_type ldap_group children-max=10 children-startup=3 children-idle=1 %LOGIN /usr/local/bin/squid_ldap_group.py

acl group_proxy_users external ldap_group proxy_users
acl group_proxy_admins external ldap_group proxy_admins

# ------------------------------------------------------------------------------
# Access Control Lists
# ------------------------------------------------------------------------------
acl all src all
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http
acl CONNECT method CONNECT

acl authenticated_user proxy_auth REQUIRED

# Whitelist & Blacklist files
acl domain_blacklist dstdomain "/etc/squid/acl/blacklist_domains.txt"
acl domain_whitelist dstdomain "/etc/squid/acl/whitelist_domains.txt"

# ------------------------------------------------------------------------------
# Rules Evaluation (Order is strict)
# ------------------------------------------------------------------------------
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# 1. Require LDAP authentication for ALL requests
http_access deny !authenticated_user

# 2. Block blacklisted domains even for authenticated users
http_access deny domain_blacklist

# 3. Allow whitelisted domains
http_access allow domain_whitelist

# 4. Allow members of proxy_admins and proxy_users
http_access allow group_proxy_admins
http_access allow group_proxy_users

# 5. Final Catch-All
http_access deny all

# ------------------------------------------------------------------------------
# Privacy & Headers
# ------------------------------------------------------------------------------
forwarded_for delete
via off
request_header_access X-Forwarded-For deny all
request_header_access Via deny all

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logformat sarg_combined %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt
access_log daemon:/var/log/squid/access.log sarg_combined
cache_log /var/log/squid/cache.log
logfile_rotate 10

# ------------------------------------------------------------------------------
# Cache Configuration
# ------------------------------------------------------------------------------
coredump_dir /var/spool/squid
refresh_pattern ^ftp:           1440    20%     10080
refresh_pattern ^gopher:        1440    0%      1440
refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
refresh_pattern .               0       20%     4320
