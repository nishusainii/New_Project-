# ==============================================================================
# Innspark Solutions - SARG (Squid Analysis Report Generator) Configuration
# Output Location: /var/www/html/sarg
# ==============================================================================

# Language
language English

# Squid Access Log Path
access_log /var/log/squid/access.log

# Report Output Directory
output_dir /var/www/html/sarg

# Web Report Title
title "Innspark Solutions - Squid Proxy Access Reports"

# Visual Appearance
font_face Arial, Helvetica, sans-serif
header_color #1a365d
header_bgcolor #edf2f7
font_size 12px
background_color #ffffff
text_color #2d3748
text_bgcolor #f7fafc
title_color #2b6cb0

# Temporary Working Directory
temporary_dir /tmp

# Date Format: e (European: dd/mm/yyyy), u (USA: mm/dd/yyyy), w (Worldwide: yyyy/mm/dd)
date_format e

# Overwrite existing daily reports or maintain archive
overwrite_report yes

# Handling records where user was not authenticated
records_without_userid ip

# Use comma delimiter for large numbers
use_comma yes

# Show user IP alongside username in reports
user_ip yes

# Report Sorting Priorities
topuser_sort_field BYTES reverse
user_sort_field BYTES reverse

# Value Display Format (abbreviation gives KB, MB, GB format)
displayed_values abbreviation

# Visual Graphs (requires libgd / gnuplot support)
graphs yes
graph_days_bytes_bar_color orange

# Report Modules to Generate
report_type topusers topsites sites_users users_sites date_time denied auth_failures site_user_time_date downloads

# Top Sites & Top Users Limit
topuser_num 100
topsites_num 100

# Charset
charset UTF-8

# Anonymize or privacy exclusions (optional)
# exclude_users /etc/sarg/exclude_users.txt
# exclude_hosts /etc/sarg/exclude_hosts.txt
