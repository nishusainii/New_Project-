# ==============================================================================
# Innspark Solutions - Production Squid Proxy Configuration
# Domain: innspark.in
# Server Role: Forward Caching Proxy with OpenLDAP Authentication & Group ACLs
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. NETWORK & LISTENING PORT
# ------------------------------------------------------------------------------
http_port 3128

# Proxy identity
visible_hostname proxy.innspark.in
dns_v4_first on

# ------------------------------------------------------------------------------
# 2. LDAP AUTHENTICATION CONFIGURATION
# ------------------------------------------------------------------------------
# Basic LDAP Authentication Helper
# Note: Ensure Server 1 IP (10.31.1.10) is reachable on port 389
auth_param basic program /usr/lib/squid/basic_ldap_auth \
    -b "ou=people,dc=innspark,dc=in" \
    -D "cn=squidbind,dc=innspark,dc=in" \
    -W /etc/squid/ldap_password.txt \
    -f "(&(uid=%s)(objectClass=posixAccount))" \
    -H ldap://10.31.1.10:389

auth_param basic children 20 startup=5 idle=3
auth_param basic realm Innspark Corporate Secure Proxy - Authentication Required
auth_param basic credentialsttl 2 hours
auth_param basic casesensitive off

# ------------------------------------------------------------------------------
# 3. LDAP GROUP AUTHORIZATION HELPER
# ------------------------------------------------------------------------------
# Checks if authenticated user belongs to specific LDAP group in ou=groups
external_acl_type ldap_group children-max=20 children-startup=5 children-idle=3 %LOGIN /usr/lib/squid/ext_ldap_group_acl \
    -b "ou=groups,dc=innspark,dc=in" \
    -D "cn=squidbind,dc=innspark,dc=in" \
    -W /etc/squid/ldap_password.txt \
    -f "(&(objectClass=posixGroup)(cn=%g)(memberUid=%u))" \
    -H ldap://10.31.1.10:389

# Map LDAP Groups to Squid ACLs
acl group_proxy_users external ldap_group proxy_users
acl group_proxy_admins external ldap_group proxy_admins

# ------------------------------------------------------------------------------
# 4. STANDARD ACCESS CONTROL LISTS (ACLS)
# ------------------------------------------------------------------------------
# Authorized Internal Networks
acl corporate_lan src 10.31.0.0/16
acl vpn_clients   src 10.32.0.0/16
acl localhost     src 127.0.0.1/32 ::1

# Protocol and Port Restrictions
acl SSL_ports  port 443
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http

# HTTP Methods
acl CONNECT method CONNECT

# Require Authentication
acl authenticated_user proxy_auth REQUIRED

# Domain Whitelists and Blacklists
acl domain_blacklist dstdomain "/etc/squid/acl/blacklist_domains.txt"
acl domain_whitelist dstdomain "/etc/squid/acl/whitelist_domains.txt"

# Rate Limiting & Concurrent Connection Throttling
acl max_client_connections maxconn 50

# ------------------------------------------------------------------------------
# 5. ACCESS RULES (ORDER IS CRITICAL)
# ------------------------------------------------------------------------------
# 1. Deny invalid/unsafe destination ports
http_access deny !Safe_ports

# 2. Deny CONNECT tunnels to non-SSL ports
http_access deny CONNECT !SSL_ports

# 3. Only allow requests originating from authorized internal corporate subnets
http_access deny !corporate_lan !vpn_clients !localhost

# 4. Enforce connection limit per client IP
http_access deny max_client_connections

# 5. Allow localhost without authentication (for local administrative scripts)
http_access allow localhost

# 6. Require all other connections to be authenticated
http_access deny !authenticated_user

# 7. Always allow whitelisted domains (even if in general blacklist)
http_access allow domain_whitelist

# 8. Deny domains listed in the blacklist
http_access deny domain_blacklist

# 9. Grant full access to Proxy Administrators
http_access allow group_proxy_admins

# 10. Grant standard access to users belonging to 'proxy_users' LDAP group
http_access allow group_proxy_users

# 11. Final Catch-All: Deny everything else
http_access deny all

# ------------------------------------------------------------------------------
# 6. PRIVACY, ANONYMITY & SECURITY HARDENING
# ------------------------------------------------------------------------------
# Strip client IP and internal network identifiers
forwarded_for delete

# Hide Squid version in headers
via off

# Strip identifying headers
request_header_access X-Forwarded-For deny
request_header_access Via deny
request_header_access Server deny

# Payload & Header Size Constraints
request_header_max_size 64 KB
request_body_max_size 100 MB
reply_header_max_size 64 KB
reply_body_max_size 500 MB all

# Socket Timeouts
client_lifetime 4 hours
pconn_timeout 60 seconds
connect_timeout 30 seconds
request_timeout 30 seconds

# ------------------------------------------------------------------------------
# 7. LOGGING FORMAT (OPTIMIZED FOR SARG REPORT GENERATOR)
# ------------------------------------------------------------------------------
# Format contains timestamp, elapsed, client IP, status, size, method, URL, auth user, ident
logformat sarg_combined %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt

access_log daemon:/var/log/squid/access.log sarg_combined
cache_log /var/log/squid/cache.log
logfile_rotate 30

# ------------------------------------------------------------------------------
# 8. CACHE & MEMORY TUNING
# ------------------------------------------------------------------------------
cache_mem 512 MB
maximum_object_size_in_memory 512 KB
maximum_object_size 100 MB
minimum_object_size 0 KB

# Disk Cache (Size: 10GB, L1: 16 directories, L2: 256 subdirectories)
cache_dir ufs /var/spool/squid 10000 16 256
coredump_dir /var/spool/squid

# Refresh Patterns
refresh_pattern ^ftp:           1440    20%     10080
refresh_pattern ^gopher:        1440    0%      1440
refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
refresh_pattern .               0       20%     4320
