# ==============================================================================
# Innspark Solutions - Apache VirtualHost Configuration for SARG Reports
# Port: 8080
# Access Control: HTTP Basic Authentication via /etc/apache2/.sarg_htpasswd
# ==============================================================================

<VirtualHost *:8080>
    ServerAdmin admin@innspark.in
    ServerName proxy.innspark.in
    DocumentRoot /var/www/html

    # Redirect root to /sarg/
    RedirectMatch ^/$ /sarg/

    <Directory "/var/www/html/sarg">
        Options +FollowSymLinks
        AllowOverride None

        # Enforce HTTP Basic Authentication
        AuthType Basic
        AuthName "Innspark Proxy Auditing - Restricted Security Admin Access"
        AuthUserFile /etc/apache2/.sarg_htpasswd
        Require valid-user

        # Restrict access to corporate management subnets
        Require ip 10.31.0.0/16
        Require ip 127.0.0.1
    </Directory>

    # Custom Logging for SARG web interface access
    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/sarg_web_error.log
    CustomLog ${APACHE_LOG_DIR}/sarg_web_access.log combined
</VirtualHost>
