modules:
  # Standard HTTP/HTTPS prober (direct check)
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [] # 2xx by default
      method: GET
      no_follow_redirects: false
      fail_if_ssl: false
      fail_if_not_ssl: false

  # Probe internet HTTP/HTTPS endpoints THROUGH the Squid proxy
  # Verifies that Squid is actively proxying traffic successfully
  squid_http_proxy:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 204, 301, 302]
      method: GET
      proxy_url: "http://127.0.0.1:3128" # Update if Squid is on another port or requires auth: http://user:pass@127.0.0.1:3128

  # TCP probe: Checks if Squid proxy port is actively listening and accepting connections
  tcp_connect:
    prober: tcp
    timeout: 5s

  # ICMP/Ping prober to verify basic network reachability
  icmp_ping:
    prober: icmp
    timeout: 5s
