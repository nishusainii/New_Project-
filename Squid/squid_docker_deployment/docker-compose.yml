services:
  # =========================================================================
  # 1. Node Exporter: Collects Host System Metrics (CPU, RAM, Disk, Network)
  # =========================================================================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--web.listen-address=:9100'
    # Resource constraints guarantee production Squid is never starved
    mem_limit: 128m
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # =========================================================================
  # 2. Squid Exporter: Scrapes Squid Cachemgr (Requests, Hit Ratio, Memory, FDs)
  # =========================================================================
  squid-exporter:
    image: boynux/squid-exporter:v1.13.0
    container_name: squid-exporter
    restart: unless-stopped
    # host mode ensures requests reach 127.0.0.1 (Squid's localhost manager ACL)
    network_mode: host
    environment:
      - SQUID_HOSTNAME=${SQUID_HOSTNAME:-127.0.0.1}
      - SQUID_PORT=${SQUID_PORT:-3128}
      - SQUID_EXPORTER_LISTEN=:9301
      # Optional: set if cachemgr requires auth in squid.conf
      # - SQUID_LOGIN=${SQUID_USER}
      # - SQUID_PASSWORD=${SQUID_PASS}
    mem_limit: 128m
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M

  # =========================================================================
  # 3. Blackbox Exporter: Probes Squid Availability & End-to-End Proxying
  # =========================================================================
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW # Enables ICMP ping probing
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
      - '--web.listen-address=:9115'
    mem_limit: 128m
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
